name: CI

on:
  push:
    branches: [main, lite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    # Одноразовый Postgres раннера; пароль синтетический, наружу не публикуется
    # (порт доступен только самому раннеру).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password  # синтетический, не секрет
          POSTGRES_DB: synaq_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d synaq_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Паритетный тест агрегатора на настоящем Postgres (создаёт и удаляет схему events)
      SYNAQ_TEST_PG_DSN: postgresql://ci_test:ci_test_password@127.0.0.1:5432/synaq_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements-test.txt
            apps/analytics_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r tests/requirements-test.txt \
            -r apps/analytics_api/requirements.txt \
            ruff==0.17.0

      - name: Ruff
        run: ruff check apps tests sdk

      - name: Pytest
        run: pytest tests/ -q

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: apps/synaq
            cache: true
            build: true
          # sdk/go has no external dependencies (no go.sum), so there is nothing to cache.
          - module: sdk/go
            cache: false
            build: false
    # Одноразовый Postgres раннера; пароль синтетический, наружу не публикуется
    # (порт доступен только самому раннеру).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password  # синтетический, не секрет
          POSTGRES_DB: synaq_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d synaq_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Интеграционные тесты synaq на настоящем Postgres (без него пропускаются)
      SYNAQ_TEST_DATABASE_URL: postgres://ci_test:ci_test_password@127.0.0.1:5432/synaq_test?sslmode=disable
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: ${{ matrix.cache }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      # -race needs cgo; the ubuntu runner ships gcc.
      - name: Go test (race detector)
        run: go test -race ./...

      - name: Go build
        if: ${{ matrix.build }}
        run: go build -o /tmp/synaq ./cmd/synaq

  smoke:
    name: Smoke (synaq HTTP API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements-test.txt
            apps/analytics_api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      # Стенд tests/contract/docker-compose.contract.yml (synaq + Postgres + JWKS,
      # ClickHouse в профиле clickhouse); run.sh сам поднимает и сносит его.
      # Docker и compose есть на ubuntu-latest. События: Postgres (по умолчанию) и ClickHouse.
      - name: Smoke suite (events in Postgres)
        env:
          PYTHON: python
        run: tests/contract/run.sh -q

      - name: Smoke suite (events in ClickHouse)
        env:
          PYTHON: python
          SMOKE_EVENT_SINK: clickhouse
        run: tests/contract/run.sh -q

  dashboard:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same version as the base image in apps/dashboard/Dockerfile.
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [analytics_api, synaq, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.service }}
          push: false
          tags: synaqcore/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
