version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm
  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly

  # Go-модули
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /apps/synaq
    schedule:
      interval: weekly

  # Python (requirements.txt)
  - package-ecosystem: pip
    directory: /apps/experiment_api
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /apps/analytics_api
    schedule:
      interval: weekly

  # Базовые образы Dockerfile
  - package-ecosystem: docker
    directory: /apps/experiment_api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/analytics_api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/synaq
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/dashboard
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/zitadel
    schedule:
      interval: weekly
