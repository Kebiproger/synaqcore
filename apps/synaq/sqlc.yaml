# Генерация: из apps/synaq
#   docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.30.0 generate
# Сгенерированный код (internal/store/sqlcdb) коммитится.
version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcdb
        out: internal/store/sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
