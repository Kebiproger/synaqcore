# Конфиг nginx внутри контейнера dashboard (nginx-unprivileged, uid 101).
# Копируется в /etc/nginx/templates/ и проходит envsubst (только ${ZITADEL_ORIGIN};
# переменные nginx вида $uri не затрагиваются, т.к. такие env не заданы).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck контейнера
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    # Runtime-конфиг OIDC, который пишет bootstrap Zitadel (read-only volume).
    location = /dashboard/oidc.json {
        alias /zitadel-public/oidc.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    # Хешированные ассеты Vite — кэш навсегда.
    location /dashboard/assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    # SPA: всё остальное под /dashboard/ → index.html (без кэша).
    location /dashboard/ {
        try_files $uri /dashboard/index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    location / {
        return 404;
    }
}
