# Общие заголовки безопасности. Подключается в каждом location, т.к. add_header
# внутри location отменяет наследование заголовков с уровня server.
# ${ZITADEL_ORIGIN} подставляется envsubst при старте контейнера.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${ZITADEL_ORIGIN}; frame-src ${ZITADEL_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
