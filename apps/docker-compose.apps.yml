services:
  experiment_api:
    container_name: experiment_api
    build: experiment_api
    env_file: .env.apps
    expose:
      - "8000"
    networks:
      - ab_testing_net
    volumes:
      - ./experiment_api:/app
    command: "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
  track_api:
    container_name: track_api
    build: track_api_go
    env_file: .env.apps
    expose:
      - "8000"
    networks:
      - ab_testing_net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  ab_testing_net:
    name: ab_testing_net
