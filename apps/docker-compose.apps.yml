# Lite-стек: synaq (Go-монолит: выдача вариантов + admin API + трекер) и analytics_api.
# Python experiment_api и Go track_api с Kafka/Redis — Python-версия (тег v1-python).
services:
  synaq:
    container_name: synaq
    build: ./synaq
    env_file: .env.apps
    environment:
      # События пишутся напрямую в ClickHouse (батчами по HTTP), без Kafka
      EVENT_SINK: clickhouse
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      # Бизнес-БД — отдельный postgres-app (учётка POSTGRES_USER/_PASSWORD/_DB из .env.apps)
      POSTGRES_HOST: postgres-app
      POSTGRES_PORT: 5432
      # Zitadel OIDC; можно переопределить в shell/корневом .env
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${ZITADEL_PORT:-8081}}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://zitadel:8080/oauth/v2/keys}
      OIDC_JWKS_HOST: ${OIDC_JWKS_HOST:-localhost:${ZITADEL_PORT:-8081}}
      OIDC_CONFIG_FILE: ${OIDC_CONFIG_FILE:-/zitadel-public/oidc.json}
      # Мягкий лимит кучи Go ниже mem_limit: GC ужесточается до OOM-kill
      GOMEMLIMIT: 192MiB
    volumes:
      # Публичная OIDC-конфигурация (issuer, project_id, client_id) от zitadel-init
      - ../infra/zitadel/public:/zitadel-public:ro
    networks:
      - ab_testing_net
    mem_limit: 256m
    # Hardening: статический бинарник, ФС только для чтения, без capabilities
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
    depends_on:
      postgres-app:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # Готовность = снимок конфигураций загружен из Postgres (/readyz). Доступность
    # ClickHouse для мониторинга — отдельно, GET /health/track (через gateway).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Graceful shutdown: до 5 с на остановку HTTP и до 5 с на дозапись буфера
    # в ClickHouse (CloseTimeout). Стандартных 10 с Docker не хватает с запасом,
    # после них контейнер получает SIGKILL и принятые события теряются.
    stop_grace_period: 20s

  analytics_api:
    container_name: analytics_api
    build: analytics_api
    env_file: .env.apps
    environment:
      # Zitadel OIDC; можно переопределить в shell/корневом .env
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${ZITADEL_PORT:-8081}}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://zitadel:8080/oauth/v2/keys}
      OIDC_JWKS_HOST: ${OIDC_JWKS_HOST:-localhost:${ZITADEL_PORT:-8081}}
      OIDC_CONFIG_FILE: ${OIDC_CONFIG_FILE:-/zitadel-public/oidc.json}
      # Код из образа (без bind mount): .pyc в read-only ФС не пишем
      PYTHONDONTWRITEBYTECODE: "1"
    # Без --reload и без монтирования исходников: CMD образа
    # (uvicorn src.main:app --host 0.0.0.0 --port 8000). Изменения кода — через --build.
    volumes:
      - ../infra/zitadel/public:/zitadel-public:ro
    networks:
      - ab_testing_net
    mem_limit: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # SPA-дашборд (статика за nginx-unprivileged, uid 101). Наружу — только через gateway (/dashboard/).
  dashboard:
    container_name: dashboard
    build: ./dashboard
    environment:
      ZITADEL_ORIGIN: http://localhost:${ZITADEL_PORT:-8081}
    mem_limit: 64m
    # Hardening: корневая ФС только для чтения, без capabilities.
    # nginx-unprivileged пишет только в /tmp (pid, *_temp) и /etc/nginx/conf.d
    # (envsubst рендерит шаблоны при старте); логи идут в stdout/stderr.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755,size=16m
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755,size=1m
    volumes:
      # oidc.json (issuer, client_id) от zitadel-init; файл 644 — читается uid 101
      - ../infra/zitadel/public:/zitadel-public:ro
    networks:
      - ab_testing_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  ab_testing_net:
    name: ab_testing_net
