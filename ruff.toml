# Базовая конфигурация ruff для CI.
target-version = "py311"
extend-exclude = ["venv", "node_modules"]

[lint]
select = ["E", "F"]
# Временно игнорируемый техдолг (исправить и убрать из списка):
# E501 - длинные строки (~230 мест), F401 - неиспользуемые импорты,
# F541 - f-строки без плейсхолдеров, E402 - импорты не в начале модуля
# (тесты/locust меняют sys.path до импорта src.*).
ignore = ["E501", "F401", "F541", "E402"]
