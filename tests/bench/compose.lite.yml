# Override стенда бенчмарка для lite (ветка lite, Go-монолит synaq).
# Подключается вторым -f к корневому docker-compose.yml lite-worktree.
# Смысл тот же, что в compose.heavy.yml: cpuset ${SUT_CPUS}, отдельная сеть
# synbench_net, nginx.conf без limit_req из ${BENCH_WORK}, bootstrap-каталоги
# Zitadel в ${BENCH_WORK}, ограничение размера логов. Порты только 127.0.0.1.
# container_name = sb-<сервис> (см. compose.heavy.yml).
# mem_limit, GOMEMLIMIT, настройки Postgres/ClickHouse остаются как в продукте.

x-sut: &sut
  cpuset: ${SUT_CPUS:-0-1}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "2"}

services:
  postgres-app:
    <<: *sut
    container_name: sb-postgres-app
  postgres-app-init:
    <<: *sut
    container_name: sb-postgres-app-init
  postgres-zitadel:
    <<: *sut
    container_name: sb-postgres-zitadel
  clickhouse:
    <<: *sut
    container_name: sb-clickhouse
  zitadel-dbinit:
    <<: *sut
    container_name: sb-zitadel-dbinit
  zitadel-setup:
    <<: *sut
    container_name: sb-zitadel-setup
    volumes:
      - ${BENCH_WORK}/zitadel/secrets:/zitadel-secrets
  zitadel:
    <<: *sut
    container_name: sb-zitadel
  zitadel-init:
    <<: *sut
    container_name: sb-zitadel-init
    volumes:
      - ${BENCH_WORK}/zitadel/secrets:/zitadel-secrets
      - ${BENCH_WORK}/zitadel/public:/zitadel-public
  synaq:
    <<: *sut
    container_name: sb-synaq
    volumes:
      - ${BENCH_WORK}/zitadel/public:/zitadel-public:ro
  analytics_api:
    <<: *sut
    container_name: sb-analytics_api
    volumes:
      - ${BENCH_WORK}/zitadel/public:/zitadel-public:ro
  dashboard:
    <<: *sut
    container_name: sb-dashboard
    volumes:
      - ${BENCH_WORK}/zitadel/public:/zitadel-public:ro
  gateway:
    <<: *sut
    container_name: sb-gateway
    volumes:
      - ${BENCH_WORK}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LITE_DIR}/sdk:/var/www/sdk:ro

networks:
  ab_testing_net:
    name: synbench_net
