# Smoke-стенд Go-сервиса synaq (apps/synaq): synaq + Postgres + статический JWKS.
# По умолчанию события пишутся в Postgres (SMOKE_EVENT_SINK=postgres, как в боевом
# lite-стеке: роли создаёт тот же infra/postgres-app/init-roles.sh). ClickHouse
# (только 01-tables.sql) поднимается в профиле clickhouse: run.sh добавляет
# `--profile clickhouse` при SMOKE_EVENT_SINK=clickhouse. Только для тестов.
#
# ВНИМАНИЕ: все пароли ниже — СИНТЕТИЧЕСКИЕ ТЕСТОВЫЕ значения одноразового стенда
# (Postgres/ClickHouse без внешних портов, данные в tmpfs, `down -v`). Это не секреты
# и нигде больше не используются. Не копируйте их в боевые конфиги.
#
# Отдельное имя проекта (name:) — стенд никогда не трогает основной стек.
# Запуск: tests/contract/run.sh. Наружу публикуется только 127.0.0.1:18002.

name: synaq-contract

x-test-oidc: &test-oidc
  # Ключи JWKS генерирует tests/contract/conftest.py и пишет в ./.runtime/jwks.json
  OIDC_ISSUER: http://contract-issuer.test
  OIDC_AUDIENCE: "000000000000000001"
  OIDC_JWKS_URL: http://jwks:8000/jwks.json
  OIDC_JWKS_HOST: ""
  OIDC_CONFIG_FILE: ""

services:
  # ─────────── Общий JWKS (статический файл) ───────────
  jwks:
    image: python:3.11-alpine
    command: ["python", "-m", "http.server", "8000", "--directory", "/srv/jwks"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ./.runtime:/srv/jwks:ro
    networks: [contract_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  # ─────────── Postgres ───────────
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contract_test
      POSTGRES_PASSWORD: contract_test_password  # синтетический тестовый пароль
      POSTGRES_DB: synaq_smoke
    tmpfs: [/var/lib/postgresql/data]
    networks: [contract_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_test -d synaq_smoke"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Роли synaq_app / synaq_analytics: тот же скрипт, что в боевом стеке (postgres-app-init)
  pg-init:
    image: postgres:16-alpine
    user: "70:70"
    entrypoint: ["/bin/sh", "/init-roles.sh"]
    environment:
      PGHOST: pg
      PGUSER: contract_test
      PGPASSWORD: contract_test_password  # синтетический тестовый пароль
      PGDATABASE: synaq_smoke
      PGCONNECT_TIMEOUT: "10"
      # Синтетические пароли ролей (>=16 символов и разные — требует init-roles.sh)
      SYNAQ_DB_PASSWORD: contract-synaq-app-password-0001
      ANALYTICS_DB_PASSWORD: contract-analytics-password-0002
    volumes:
      - ../../infra/postgres-app/init-roles.sh:/init-roles.sh:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [contract_net]
    depends_on:
      pg: {condition: service_healthy}
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [clickhouse]
    environment:
      CLICKHOUSE_USER: contract_test
      CLICKHOUSE_PASSWORD: contract_test_password  # синтетический тестовый пароль
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      # Только таблица событий (lite-режим, без Kafka)
      - ../../infra/clickhouse/init/01-tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
    tmpfs: [/var/lib/clickhouse]
    networks: [contract_net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  synaq:
    build:
      # SYNAQ_BUILD_CONTEXT — собрать из другого каталога (например, снимка git archive)
      context: ${SYNAQ_BUILD_CONTEXT:-../../apps/synaq}
    environment:
      <<: *test-oidc
      POSTGRES_HOST: pg
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synaq_app
      POSTGRES_PASSWORD: contract-synaq-app-password-0001  # синтетический тестовый пароль
      POSTGRES_DB: synaq_smoke
      EVENT_SINK: ${SMOKE_EVENT_SINK:-postgres}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: contract_test
      CLICKHOUSE_PASSWORD: contract_test_password  # синтетический тестовый пароль
    depends_on:
      pg: {condition: service_healthy}
      pg-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy, required: false}
      jwks: {condition: service_healthy}
    ports:
      - "127.0.0.1:${SYNAQ_PORT:-18002}:8000"
    networks: [contract_net]

networks:
  contract_net:
    name: synaq-contract-net
