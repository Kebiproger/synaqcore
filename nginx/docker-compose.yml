services:
  gateway:
    image: nginx:1.31.6-alpine
    container_name: gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
      # Zitadel (IdP). ZITADEL_EXTERNALPORT берётся из того же ${ZITADEL_PORT:-8081}:
      # Zitadel проверяет Host и выдаёт issuer http://localhost:${ZITADEL_PORT}.
      - "127.0.0.1:${ZITADEL_PORT:-8081}:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../sdk:/var/www/sdk:ro
    networks:
      - ab_testing_net
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      synaq:
        condition: service_started
      analytics_api:
        condition: service_started
      dashboard:
        condition: service_started
      # nginx резолвит имена upstream при старте — контейнер zitadel должен существовать
      zitadel:
        condition: service_started

networks:
  ab_testing_net:
    name: ab_testing_net
