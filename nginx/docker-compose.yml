services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ab_testing_net
    restart: unless-stopped
    depends_on:
      - experiment_api
      - track_api

networks:
  ab_testing_net:
    name: ab_testing_net
