# ==============================================================================
# Определение реального IP за Cloudflare и корпоративным Nginx
# ==============================================================================
# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Внутренние и корпоративные сети (Docker bridge, localhost, частные подсети)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Rate limit публичной выдачи вариантов: при падении Redis каждый запрос идёт
# в Postgres, поэтому ограничиваем RPS с одного IP (защита от DoS на БД).
limit_req_zone $binary_remote_addr zone=variants:10m rate=50r/s;

upstream experiment_backend {
    server experiment_api:8000;
    keepalive 64;
}

upstream track_backend {
    server track_api:8000;
    keepalive 64;
}

upstream dashboard_backend {
    server dashboard:8080;
    keepalive 16;
}

upstream analytics_backend {
    server analytics_api:8000;
    keepalive 64;
}

# Не раскрываем версию nginx (заголовок Server, страницы ошибок)
server_tokens off;

server {
    listen 80;
    # Относительные Location в редиректах (иначе теряется опубликованный порт 8080)
    absolute_redirect off;

    # Общие настройки Keep-Alive и безопасность
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ограничение размера тела запроса (защита от DoS)
    client_max_body_size 1m;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Раздача клиентского JS SDK SynaqCore
    location = /sdk {
        return 301 /sdk/;
    }

    location /sdk/ {
        alias /var/www/sdk/;
        index synaq.js;
        default_type application/javascript;

        # Кэширование клиентского SDK
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;

        # CORS preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # CORS заголовки для загрузки скрипта
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/v1/experiments/ {
        proxy_pass http://experiment_backend;
    }

    location /api/v1/variants/ {
        limit_req zone=variants burst=100 nodelay;
        limit_req_status 429;

        # CORS preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID,X-Device-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # CORS заголовки для публичных запросов SDK
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID,X-Device-ID" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://experiment_backend;
    }

    location /api/v1/stats/ {
        proxy_pass http://analytics_backend;
    }

    location /api/v1/tracker/ {
        # CORS preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID,X-Device-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # CORS заголовки для публичных запросов SDK
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID,X-Device-ID" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://track_backend;
    }

    # Админка переехала в SPA-дашборд
    location = /admin {
        return 302 /dashboard/;
    }

    location /admin/ {
        return 302 /dashboard/;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    # SPA-дашборд: CSP / X-Frame-Options выставляет сам контейнер dashboard.
    # add_header на уровне location отменяет наследование серверных add_header,
    # поэтому здесь только безопасный X-Content-Type-Options (заголовок контейнера
    # скрываем, чтобы не было дубля).
    location /dashboard/ {
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://dashboard_backend;
    }

    location = /health/track {
        proxy_pass http://track_backend/health;
    }

    location /health {
        proxy_pass http://experiment_backend;
    }
}

# ==============================================================================
# Zitadel (IdP). Отдельный порт, а не префикс пути: Zitadel не умеет работать под
# префиксом, а его корневые пути (/admin/v1, /management/v1, /ui/console ...)
# конфликтуют с нашими (/admin). По официальному примеру Zitadel для nginx весь
# трафик идёт через grpc_pass (h2c) — так работают и gRPC, и gRPC-web, и REST.
# Host сохраняется как есть (localhost:8081): Zitadel определяет инстанс по Host,
# и он должен совпадать с ExternalDomain:ExternalPort.
# ==============================================================================
server {
    listen 8081;
    http2 on;

    client_max_body_size 5m;

    # Встроенный DNS Docker + переменная: адрес zitadel резолвится в рантайме,
    # поэтому пересоздание контейнера zitadel не ломает gateway (нет «залипшего» IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $zitadel_upstream zitadel:8080;

    location / {
        grpc_pass grpc://$zitadel_upstream;
        grpc_set_header Host $http_host;
        grpc_set_header X-Real-IP $remote_addr;
        # Gateway — единственная точка входа: не доверяем клиентскому X-Forwarded-For
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_set_header X-Forwarded-Proto $scheme;
    }
}
