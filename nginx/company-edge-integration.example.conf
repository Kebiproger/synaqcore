# ==============================================================================
# SynaqCore - Пример конфигурации интеграции для корпоративного Nginx (Edge/DMZ)
# ==============================================================================
# Этот файл содержит готовые шаблоны для DevOps-инженеров компании по подключению
# платформы A/B-тестирования SynaqCore перед внешним миром (Cloudflare / Edge Nginx).
#
# В соответствии с моделью Zero-Trust контейнеры SynaqCore слушают строго локальный
# интерфейс 127.0.0.1:
#   - 127.0.0.1:8080 : SynaqCore Gateway (Nginx шлюз: SDK, API, Dashboard)
#   - 127.0.0.1:8081 : Zitadel IdP (gRPC / HTTP2 SSO консоль и токены)
#
# Содержание:
#   СЦЕНАРИЙ 1: Отдельный поддомен (ab.company.com) - РЕКОМЕНДУЕМЫЙ
#   СЦЕНАРИЙ 2: Путь на основном домене компании (company.com/synaq/)
#   БЛОК БЕЗОПАСНОСТИ: Ограничение доступа к /dashboard/ (VPN / Cloudflare Access)
# ==============================================================================

# ------------------------------------------------------------------------------
# Upstream-пулы шлюза SynaqCore
# ------------------------------------------------------------------------------
upstream synaqcore_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream synaqcore_zitadel {
    server 127.0.0.1:8081;
    keepalive 32;
}

# ==============================================================================
# СЦЕНАРИЙ 1: Выделенный поддомен (например, ab.company.com)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ab.company.com;

    # Принудительный редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ab.company.com;

    # SSL сертификаты (Let's Encrypt / Корпоративный CA / Cloudflare Origin Cert)
    ssl_certificate /etc/ssl/certs/company_bundle.crt;
    ssl_certificate_key /etc/ssl/private/company_privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Общие прокси-заголовки
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # --------------------------------------------------------------------------
    # Проброс реального IP в SynaqCore Gateway
    # Если вышестоящим слоем является Cloudflare, пересылаем $http_cf_connecting_ip.
    # Если трафик поступает напрямую на корпоративный Nginx, передаем $remote_addr.
    # --------------------------------------------------------------------------
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    # Если Cloudflare НЕ используется, раскомментируйте строку ниже:
    # proxy_set_header CF-Connecting-IP $remote_addr;

    # --------------------------------------------------------------------------
    # 1. Публичные маршруты SDK и Client API (доступны из браузеров клиентов)
    # --------------------------------------------------------------------------
    
    # Раздача клиентского JS SDK (synaq.js)
    location /sdk/ {
        proxy_pass http://synaqcore_gateway;
        
        # Разрешаем кэширование на уровне edge-прокси компании
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Публичный API выдачи вариантов экспериментов
    location /api/v1/variants/ {
        proxy_pass http://synaqcore_gateway;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # Публичный API сбора метрик и событий
    location /api/v1/tracker/ {
        proxy_pass http://synaqcore_gateway;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # Внутренний API управления экспериментами (Restricted)
    location /api/v1/experiments/ {
        # См. настройки защиты ниже
        # include /etc/nginx/snippets/synaq-admin-auth.conf;
        proxy_pass http://synaqcore_gateway;
    }

    # Аналитический API для построения графиков
    location /api/v1/stats/ {
        # include /etc/nginx/snippets/synaq-admin-auth.conf;
        proxy_pass http://synaqcore_gateway;
    }

    # --------------------------------------------------------------------------
    # 2. Панель управления (Dashboard / Admin) - СТРОГО ОГРАНИЧЕННЫЙ ДОСТУП
    # --------------------------------------------------------------------------
    location /dashboard/ {
        # === ВАРИАНТ А: Ограничение по белому списку IP (Офис / Корпоративный VPN) ===
        # allow 192.0.2.0/24;       # Офисная сеть 1
        # allow 198.51.100.50;      # VPN шлюз компании
        # allow 10.0.0.0/8;         # Внутренняя корпоративная сеть
        # deny all;

        # === ВАРИАНТ Б: Авторизация через Cloudflare Access (Zero-Trust) ===
        # Проверяем наличие заголовка Cloudflare Access
        # if ($http_cf_access_authenticated_user_email = "") {
        #     return 403 "Access Denied: Cloudflare Access Authentication Required\n";
        # }

        proxy_pass http://synaqcore_gateway;
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 302 /dashboard/;
    }

    location /admin/ {
        return 302 /dashboard/;
    }

    # --------------------------------------------------------------------------
    # 3. Healthcheck для балансировщика компании
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://synaqcore_gateway;
        access_log off;
    }
}


